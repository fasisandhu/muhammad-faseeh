name: ggi

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      KC_HEALTH_ENABLED: 'true'
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-not-configured}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-not-configured}
    volumes:
      - ./keycloak/realm-ggi.json:/opt/keycloak/data/import/realm-ggi.json:ro
    ports:
      - '127.0.0.1:8080:8080'
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ggi
      POSTGRES_USER: ggi_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?Set POSTGRES_OWNER_PASSWORD in .env}
      GGI_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-init-app-role.sh:ro
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ggi_owner -d ggi']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command:
      [
        'redis-server',
        '--requirepass',
        '${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}',
        '--save',
        '',
        '--appendonly',
        'no',
      ]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    image: ggi-api:local
    command: ['node', 'dist/migrate.js']
    environment:
      DATABASE_MIGRATION_URL: postgres://ggi_owner:${POSTGRES_OWNER_PASSWORD}@postgres:5432/ggi
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build: .
    image: ggi-api:local
    environment:
      NODE_ENV: production
      PORT: '3000'
      PUBLIC_BASE_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      DATABASE_URL: postgres://ggi_app:${POSTGRES_APP_PASSWORD}@postgres:5432/ggi
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      OIDC_ISSUER: http://localhost:8080/realms/ggi
      OIDC_AUDIENCE: ggi-api
      OIDC_JWKS_URI: http://keycloak:8080/realms/ggi/protocol/openid-connect/certs
      HEALTH_CHECK_TOKEN: ${HEALTH_CHECK_TOKEN:?Set HEALTH_CHECK_TOKEN in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PAYMENT_FAILURE_RATE: ${PAYMENT_FAILURE_RATE:-0.2}
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
volumes:
  pgdata: {}
